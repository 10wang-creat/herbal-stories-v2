title: 草本故事館
email: s881705@gmail.com
description: >-
  用故事認識中藥方劑，讓傳統醫學變得生動有趣
baseurl: ""
url: "https://herbalstoryhouse.com"
github_username: 10wang-creat

# Build settings
future: false
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap

# 不要被 Jekyll 當成網站內容的資料夾／檔案（tools/ 有中文檔名的 .bat，會讓 Vercel 的 Linux build 出錯）
exclude:
  - tools/
  - Claude outputs/
  - README.md
  - Gemfile
  - Gemfile.lock
  - vercel.json
  - node_modules/
  - vendor/

# Collections
collections:
  stories:
    output: true
    permalink: /stories/:name/
  zhengliao:
    output: true
    permalink: /zhengliao/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "stories"
    values:
      layout: "story"
  - scope:
      path: ""
      type: "zhengliao"
    values:
      layout: "zhengliao"
      body_class: "theme-zhengliao"

# 導航欄設定
header_pages:
  - index.markdown
  - formulas.html
  - paozhi.html
  - stories.html
  - about.markdown

  # Disqus 留言系統
disqus:
  shortname: herbal-stories
