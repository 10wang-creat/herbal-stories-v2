{% if page.tags and page.tags.size > 0 %}
<div class="post-tags-container">
  <h3 class="tags-heading">
    <span class="tags-icon">🏷️</span> 相關標籤
  </h3>
  <div class="tags-list">
    {% for tag in page.tags %}
      <a class="post-tag" href="{{ '/tags/' | relative_url }}#tag-{{ tag | url_encode }}" title="看所有「{{ tag }}」相關文章">{{ tag }}</a>
    {% endfor %}
  </div>
</div>
{% endif %}
